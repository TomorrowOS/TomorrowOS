name: Sync Platform Compatibility

on:
  push:
    branches:
      - main
    paths:
      - "docs/data/platform-compatibility.json"

permissions:
  contents: write

jobs:
  sync-platform-compatibility:
    name: Sync platform compatibility docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate platform compatibility documentation
        run: node scripts/generate-platform-compatibility.mjs

      - name: Check for generated changes
        id: changes
        shell: bash
        run: |
          if ! git diff --quiet -- \
            README.md \
            docs/README.md \
            docs/README.mdx \
            docs/guides/beginners-guide.md; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated documentation
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add docs/README.mdx
          git add docs/guides/beginners-guide.md

          git commit -m "docs: sync platform compatibility"
          git push